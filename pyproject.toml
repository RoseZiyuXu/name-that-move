[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "motion-clf"
version = "0.1.0"
description = "Time-series motion classification using MiniRocket"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "numpy==1.26.4",
    "torch",
    "tsai",
    "tsaug",
    "scikit-learn",
    "sktime",
    "tqdm",
]

[project.optional-dependencies]
dev = ["pytest", "ipykernel", "jupyter"]

[tool.hatch.build.targets.wheel]
packages = ["src/motion_clf"]
